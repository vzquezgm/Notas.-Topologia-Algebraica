name: Actualizar ejercicios

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '*.py'
      - '.github/workflows/ejercicios.yml'

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # PROYECTO A
      # ======================================================

      - name: Obtener Proyecto A
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ======================================================
      # PROYECTO B EN GITHUB
      # ======================================================

      - name: Clonar Proyecto B
        uses: actions/checkout@v4
        with:
          repository: vzquezgm/Ejercicios.-Topologia-Algebraica
          token: ${{ secrets.PROJECT_B_TOKEN }}
          path: proyecto-b

      # ======================================================
      # EJECUTAR SINCRONIZADOR
      # ======================================================

      - name: Ejecutar sincronizador
        env:
          PROYECTO_B: proyecto-b
        run: |
          python main.py

      # ======================================================
      # GUARDAR CAMBIOS EN PROYECTO A
      # ======================================================

      - name: Preparar cambios de Proyecto A
        id: cambios-a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.tex'
          git add '*.py'

          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios en Proyecto A"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"

            echo "Archivos .tex modificados:"
            git diff --cached --name-only -- '*.tex' > /tmp/archivos_a.txt
            cat /tmp/archivos_a.txt

            git commit -m "Asignar IDs a ejercicios [skip ci]"
            git push
          fi

      # ======================================================
      # GUARDAR CAMBIOS EN GITHUB B
      # ======================================================

      - name: Actualizar GitHub B
        working-directory: proyecto-b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios en Proyecto B"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push
          fi

      # ======================================================
      # CLONAR OVERLEAF B
      # ======================================================

      - name: Clonar Overleaf B
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git clone \
            "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/6a840b7e222828e4c0e48fec" \
            overleaf-b

      # ======================================================
      # ACTUALIZAR OVERLEAF B
      # ======================================================

      - name: Actualizar ejercicios en Overleaf B
        run: |
          mkdir -p overleaf-b/ejercicios

          rm -rf overleaf-b/ejercicios/*
          cp -r proyecto-b/ejercicios/* overleaf-b/ejercicios/

      - name: Publicar en Overleaf B
        working-directory: overleaf-b
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add ejercicios

          if git diff --cached --quiet; then
            echo "No hay cambios en Overleaf B"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push origin HEAD:main
          fi

      # ======================================================
      # CLONAR OVERLEAF A
      # ======================================================

      - name: Clonar Overleaf A
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git clone \
            "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/6a7c13c05b0b3f3b7f7aba18" \
            overleaf-a

      # ======================================================
      # ACTUALIZAR OVERLEAF A
      # ======================================================

      - name: Actualizar archivos modificados de A
        if: steps.cambios-a.outputs.hay_cambios == 'true'
        run: |
          while IFS= read -r archivo; do
            if [ -z "$archivo" ]; then
              continue
            fi

            mkdir -p "overleaf-a/$(dirname "$archivo")"
            cp "$archivo" "overleaf-a/$archivo"

          done < /tmp/archivos_a.txt

      # ======================================================
      # PUBLICAR EN OVERLEAF A
      # ======================================================

      - name: Publicar en Overleaf A
        if: steps.cambios-a.outputs.hay_cambios == 'true'
        working-directory: overleaf-a
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add '*.tex'

          if git diff --cached --quiet; then
            echo "No hay cambios en Overleaf A"
          else
            git commit -m "Actualizar IDs de ejercicios automáticamente"
            git push origin HEAD:main
          fi