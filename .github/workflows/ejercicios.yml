name: Actualizar ejercicios

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - 'extraer_ejercicios.py'
      - '.github/workflows/ejercicios.yml'

jobs:
  extraer-y-enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener Proyecto A
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extraer ejercicios
        run: python extraer_ejercicios.py

      # =========================
      # ACTUALIZAR GITHUB B
      # =========================

      - name: Clonar Proyecto B
        uses: actions/checkout@v4
        with:
          repository: vzquezgm/Ejercicios.-Topologia-Algebraica
          token: ${{ secrets.PROJECT_B_TOKEN }}
          path: proyecto-b

      - name: Copiar ejercicios a Proyecto B
        run: |
          cp ejercicios.tex proyecto-b/ejercicios.tex

      - name: Actualizar Proyecto B
        working-directory: proyecto-b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ejercicios.tex

          if git diff --cached --quiet; then
            echo "No hay cambios en ejercicios.tex"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push
          fi

      # =========================
      # ACTUALIZAR OVERLEAF B
      # =========================

      - name: Clonar repositorio de Overleaf B
        run: |
          git clone https://git:${{ secrets.OVERLEAF_TOKEN }}@git.overleaf.com/6a840b7e222828e4c0e48fec overleaf-b

      - name: Actualizar ejercicios en Overleaf B
        run: |
          cp ejercicios.tex overleaf-b/ejercicios.tex

          cd overleaf-b

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add ejercicios.tex

          if git diff --cached --quiet; then
            echo "No hay cambios en ejercicios.tex para Overleaf"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push origin master
          fi
