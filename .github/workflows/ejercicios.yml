name: Actualizar ejercicios

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '*.py'
      - '.github/workflows/ejercicios.yml'

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # PROYECTO A
      # ======================================================

      - name: Obtener Proyecto A
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ======================================================
      # PROYECTO B
      # ======================================================

      - name: Clonar Proyecto B
        uses: actions/checkout@v4
        with:
          repository: vzquezgm/Ejercicios.-Topologia-Algebraica
          token: ${{ secrets.PROJECT_B_TOKEN }}
          path: proyecto-b

      # ======================================================
      # EJECUTAR SINCRONIZADOR
      # ======================================================

      - name: Ejecutar sincronizador
        env:
          PROYECTO_B: proyecto-b
        run: |
          python main.py

      # ======================================================
      # GUARDAR CAMBIOS EN PROYECTO A
      # ======================================================

      - name: Actualizar Proyecto A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.tex'
          git add '*.py'

          if git diff --cached --quiet; then
            echo "No hay cambios en Proyecto A"
          else
            git commit -m "Asignar IDs a ejercicios [skip ci]"
            git push
          fi

      # ======================================================
      # REVISAR PROYECTO B
      # ======================================================

      - name: Revisar Proyecto B
        working-directory: proyecto-b
        run: |
          git status
          git diff --stat

      # ======================================================
      # GUARDAR CAMBIOS EN PROYECTO B
      # ======================================================

      - name: Actualizar Proyecto B
        working-directory: proyecto-b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios en Proyecto B"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push
          fi