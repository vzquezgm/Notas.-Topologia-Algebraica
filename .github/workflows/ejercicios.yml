name: Actualizar ejercicios

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '*.py'
      - '.github/workflows/ejercicios.yml'

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # PROYECTO A
      # ======================================================

      - name: Obtener Proyecto A
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ======================================================
      # PROYECTO B
      # ======================================================

      - name: Clonar Proyecto B
        uses: actions/checkout@v4
        with:
          repository: https://github.com/vzquezgm/Ejercicios.-Topologia-Algebraica
          token: ${{ secrets.PROJECT_B_TOKEN }}
          path: proyecto-b

      # ======================================================
      # EJECUTAR NUESTRO SISTEMA
      # ======================================================

      - name: Ejecutar sincronizador
        env:
          PROYECTO_B: proyecto-b
        run: |
          python main.py

      # ======================================================
      # MOSTRAR ESTADO DE B
      # ======================================================

      - name: Revisar cambios en Proyecto B
        working-directory: proyecto-b
        run: |
          git status
          git diff --stat

      # ======================================================
      # ENVIAR CAMBIOS A GITHUB B
      # ======================================================

      - name: Actualizar GitHub B
        working-directory: proyecto-b
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios en Proyecto B"
          else
            git commit -m "Actualizar ejercicios automáticamente"
            git push
          fi